name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "package.json"
      - "apps/extension/**"
      - "packages/tools/scripts/release/pack-extension.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package versioned extension download
        run: node packages/tools/scripts/release/pack-extension.mjs
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

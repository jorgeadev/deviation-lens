<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deviation Lens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <img src="icons/icon48.png" alt="" class="logo">
      <div class="titles">
        <div class="app-title"><div class="app">Deviation Lens</div><span class="app-version" title="Version 0.2.1">0.2.1</span></div>
        <div class="page" id="pageMeta">Scanning the page…</div>
      </div>
      <button id="btnOpenSettings" class="panelIcon" type="button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.82 1.17V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-2.82-1.17l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 3.26 14H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.17-2.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 2.82 1.17l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 20.91 10H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </header>

    <div class="toolbar">
      <button type="button" id="btnRescan" class="btn">Rescan</button>
      <button type="button" id="btnReveal" class="btn" title="Clicks the artwork on the page so DeviantArt reveals the full-resolution viewer image">Reveal full</button>
    </div>

    <details id="rangeBox" class="rangeBox hidden">
      <summary>Download profile by date range</summary>
      <div class="rangeBody">
        <div class="rangeRow">
          <label class="rangeLabel">From <input type="date" id="rangeFrom"></label>
          <label class="rangeLabel">To <input type="date" id="rangeTo"></label>
          <button type="button" id="btnRangeScan" class="btn">Scan range</button>
        </div>
        <div id="rangeStatus" class="rangeStatus"></div>
        <div class="rangeRow">
          <button type="button" id="btnRangeDownload" class="btn primary" disabled>Download</button>
          <button type="button" id="btnRangeCopy" class="btn ghost" disabled>Copy URLs</button>
        </div>
      </div>
    </details>

    <div id="notice" class="notice hidden"></div>
    <div id="summary" class="summary hidden"></div>

    <ul id="list" class="list"></ul>

    <footer class="bottom">
      <div class="actions">
        <button type="button" id="btnBest" class="btn primary">Download best</button>
        <button type="button" id="btnSelected" class="btn">Download selected</button>
        <button type="button" id="btnAll" class="btn">Download all</button>
        <button type="button" id="btnCopy" class="btn ghost">Copy URLs</button>
      </div>
      <div class="jobRow">
        <div id="progress" class="progress hidden"></div>
        <button type="button" id="btnCancelJob" class="btn ghost hidden">Cancel</button>
      </div>
    </footer>
  </div>

  <dialog id="saveChoice" class="saveChoice" aria-labelledby="saveChoiceTitle">
    <h2 id="saveChoiceTitle">Where should downloads go?</h2>
    <p>This applies to single images and ZIP files. You can change it at any time in Settings.</p>
    <div class="saveChoiceOptions">
      <button type="button" id="btnChoiceFolder" class="btn primary saveChoiceOption"><b>Choose a folder</b><small>Files save straight into a folder you pick.</small></button>
      <button type="button" id="btnChoiceAsk" class="btn saveChoiceOption"><b>Ask every time</b><small>A Save As dialog opens for each image or ZIP.</small></button>
      <button type="button" id="btnChoiceDefault" class="btn saveChoiceOption"><b>Use my Downloads folder</b><small>Files save to a DeviantArt folder inside it.</small></button>
    </div>
    <p id="saveChoiceError" class="saveChoiceError hidden" role="alert"></p>
    <button type="button" id="btnChoiceCancel" class="btn ghost saveChoiceCancel">Cancel this download</button>
  </dialog>
  <script src="lib/naming.js"></script>
  <script src="lib/history.js"></script>
  <script src="lib/folder.js"></script>
  <script src="popup.js"></script>
</body>
</html>
